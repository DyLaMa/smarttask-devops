version: '3.9'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15
    container_name: annuaire-db
    environment:
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_password
      POSTGRES_DB: smarttask_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - annuaire-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: ./backend
    container_name: test-backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_password
      POSTGRES_DB: smarttask_db
    ports:
      - "3002:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - annuaire-network
    restart: unless-stopped

  # Frontend React
  frontend:
    build: ./frontend
    container_name: test-frontend
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - annuaire-network
    restart: unless-stopped

# Volumes persistants
volumes:
  postgres_data:

# Réseau dédié
networks:
  annuaire-network:
    driver: bridge
